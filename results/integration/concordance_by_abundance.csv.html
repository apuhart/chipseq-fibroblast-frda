<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<title>concordance_by_abundance.csv</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/datatables/1.13.8/css/jquery.dataTables.min.css">
<style>
body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; max-width: 1100px;
       margin: 2rem auto; padding: 0 1.2rem; background: #f7f7f8; color: #1a1a1a; }
h1 { font-size: 1.5rem; border-bottom: 2px solid #ddd; padding-bottom: .4rem; }
h2 { font-size: 1.1rem; margin-top: 2rem; color: #444; }
a { color: #0969da; text-decoration: none; }
a:hover { text-decoration: underline; }
.breadcrumb { font-size: .85rem; color: #666; margin-bottom: 1rem; }
.folder-grid, .thumb-grid { display: grid; gap: .8rem; margin: 1rem 0; }
.folder-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.thumb-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
.card { background: #fff; border: 1px solid #e3e3e3; border-radius: 10px;
        padding: .9rem 1rem; transition: box-shadow .15s; }
.card:hover { box-shadow: 0 2px 10px rgba(0,0,0,.08); }
.folder-card { display: flex; align-items: center; gap: .5rem; font-weight: 600; }
.thumb-card { padding: .5rem; text-align: center; font-size: .8rem; }
.thumb-card img { width: 100%; height: 130px; object-fit: contain; background: #fafafa;
                   border-radius: 6px; margin-bottom: .4rem; }
.filelist { list-style: none; padding: 0; }
.filelist li { background: #fff; border: 1px solid #e3e3e3; border-radius: 8px;
               padding: .5rem .8rem; margin-bottom: .4rem; }
.filelist .note { color: #888; font-size: .8rem; }
.badge { display: inline-block; font-size: .65rem; font-weight: 700; padding: 2px 7px;
         border-radius: 4px; color: #fff; margin-right: .4rem; vertical-align: middle; }
.b-csv{background:#2da44e}.b-pdf{background:#cf222e}.b-bed{background:#0969da}
.b-npz{background:#6e7781}.b-bw{background:#8250df}
.banner { background: #fff8c5; border: 1px solid #d4a72c; border-radius: 8px;
          padding: .7rem 1rem; margin: 1rem 0; font-size: .85rem; }

table.dataTable { font-size: .8rem; }
#wrap { overflow-x: auto; }
</style>
</head><body>
<div class="breadcrumb"><a href="index.html">&larr; retour au dossier</a></div>
<h1>concordance_by_abundance.csv</h1>
<div id="wrap"><table id="tbl" class="display" style="width:100%"></table></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/datatables/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
Papa.parse("concordance_by_abundance.csv", {
  download: true, header: true, skipEmptyLines: true, delimiter: ",",
  complete: function(results) {
    const cols = results.meta.fields.map(f => ({ title: f, data: f }));
    $('#tbl').DataTable({ data: results.data, columns: cols, pageLength: 25,
      scrollX: true, order: [] });
  }
});
</script>
</body></html>
